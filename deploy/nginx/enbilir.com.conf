server_tokens off;

server {
    listen 80;
    listen [::]:80;
    server_name enbilir.com www.enbilir.com;

    return 308 https://enbilir.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.enbilir.com;

    ssl_certificate /etc/letsencrypt/live/enbilir.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enbilir.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    proxy_hide_header X-Powered-By;

    return 308 https://enbilir.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name enbilir.com;

    ssl_certificate /etc/letsencrypt/live/enbilir.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enbilir.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    proxy_hide_header X-Powered-By;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
